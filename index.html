<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Checker</title>
    
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }
        h1 { color: #003399; } /* Higher contrast blue for accessibility */

        button {
            padding: 8px 16px;
            cursor: pointer;
            margin: 0 5px;
        }

        #resultList {
            list-style-type: none;
            padding: 15px;
            margin: 20px auto;
            width: 300px;
            background-color: #f9f9f9;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #resultList li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        #resultList li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <main>
        <h1>Grade Checker Page</h1>

        <label for="nameInput">Student Name:</label>
        <input type="text" id="nameInput" placeholder="Enter name" required>

        <br><br>

        <label for="scoreInput">Score (0 - 100):</label>
        <input type="number" id="scoreInput" min="0" max="100" placeholder="Enter score" required>

        <br><br>

        <button id="checkBtn" type="button">Check</button>
        <button id="clearBtn" type="button">Clear History</button>

        <br><br>

        <p id="resultArea" aria-live="polite"></p>

        <ul id="resultList" aria-label="Checked student grades"></ul>
    </main>

    <script src="app.js"></script>

</body>
</html>
